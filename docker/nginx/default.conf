server {
    listen 80;
    index index.php index.html;
    root /var/www/public;

    # Archivos estáticos compilados por Vite — se sirven directo sin tocar PHP
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|map)$ {
        expires max;
        log_not_found off;
        try_files $uri =404;
    }

    # Todo lo demás va a Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM — Nginx le pasa las peticiones .php al contenedor php:9000
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Proxy hacia FastAPI — Laravel puede hacer esto internamente,
    # pero tenerlo en Nginx permite llamar a /ai/ directamente desde Vue
    location /ai/ {
        proxy_pass http://fastapi:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;    # el LLM puede tardar en responder
    }
}