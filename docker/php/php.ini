; Necesario para subir PDFs grandes desde el panel de administración
upload_max_filesize = 50M
post_max_size = 50M

; Tiempo de ejecución — el pipeline RAG puede tardar en documentos grandes
max_execution_time = 120

; Memoria para operaciones de Laravel
memory_limit = 256M

; Zona horaria
date.timezone = America/Bogota